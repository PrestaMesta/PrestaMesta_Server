openapi: 3.0.3
info:
  title: Prestamesta API
  version: 1.0.0
  description: >
    API de Prestamesta: autenticacion de clientes y administradores, catalogo de
    creditos y ciclo de vida de solicitudes de prestamo. Los pagos, la mora y la
    liquidacion NO estan implementados todavia (ver x-pendiente-decision en el schema
    EstadoPrestamo) y por lo tanto no tienen endpoints aqui.


    Cliente y administrador usan tokens JWT con AUDIENCIAS DISTINTAS
    (`prestamesta-client` / `prestamesta-admin`): un token de un dominio nunca es
    aceptado por rutas del otro dominio, aunque la firma sea valida. Ver
    securitySchemes.bearerAuth.


    **MFA obligatorio (Checkpoint 6B-2).** Login (`POST .../auth/login`) ya NO devuelve un
    token de sesion utilizable de inmediato: devuelve un `preMfaToken` de vida corta
    (audiencia `*-pre-mfa`, claim `token_use: pre_mfa`) que solo sirve contra
    `mfa/enroll`, `mfa/enroll/confirm` y `mfa/verify` del mismo dominio. El token de sesion
    completo (`token_use: session`, claims `amr`/`auth_time`) solo se emite al completar el
    enrolamiento o el desafio MFA. Este es un cambio de contrato **incompatible hacia
    atras** respecto a versiones previas de este documento, sin capa de compatibilidad
    temporal — ver `docs/mfa-identidad-ine.md` para el diseño completo (step-up e
    identidad INE siguen sin implementarse).
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: auth-cliente
  - name: auth-admin
  - name: administradores
  - name: prestamos
  - name: salud

paths:
  /client/auth/register:
    post:
      tags: [auth-cliente]
      summary: Registra un nuevo cliente
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClienteRegistroInput'
      responses:
        '201':
          description: Cliente registrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje: { type: string, example: Cliente registrado exitosamente }
                  clienteId: { type: integer, example: 1 }
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: El correo ya esta registrado (codigo EMAIL_ALREADY_EXISTS)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /client/auth/login:
    post:
      tags: [auth-cliente]
      summary: Verifica el password de un cliente e inicia el flujo de MFA
      description: >
        **Checkpoint 6B-2 — cambio de contrato incompatible hacia atras.** Este endpoint ya
        NO devuelve un token de sesion utilizable de inmediato. Tras confirmar el password,
        devuelve un `preMfaToken` (audiencia `prestamesta-client-pre-mfa`,
        `token_use: pre_mfa`, vida corta) y el discriminador `siguientePaso`. El cliente
        HTTP debe usar ese valor (nunca inferirlo de `mfaEstado`) para decidir el siguiente
        paso:
          - `MFA_ENROLLMENT_REQUIRED` -> llamar a `POST /client/auth/mfa/enroll`.
          - `MFA_CHALLENGE_REQUIRED` -> llamar a `POST /client/auth/mfa/verify`.

        El `preMfaToken` **no sirve para ninguna otra ruta**: ni para rutas de negocio
        (`/client/prestamos/*`, etc.) ni para ninguna ruta que exija una sesion completa.
        Solo lo aceptan `mfa/enroll`, `mfa/enroll/confirm` y `mfa/verify`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
            example:
              email: juan@example.com
              password: miPasswordSeguro123
      responses:
        '200':
          description: Password correcto — continua con el flujo de MFA indicado en `siguientePaso`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginPreMfaResponse' }
        '401':
          description: >
            Credenciales invalidas (codigo INVALID_CREDENTIALS). Se devuelve el mismo
            status y mensaje generico tanto si el correo no existe como si el password es
            incorrecto, para no revelar si un correo esta registrado. Este chequeo ocurre
            antes de consultar el estado de MFA.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /client/auth/mfa/enroll:
    post:
      tags: [auth-cliente]
      summary: Inicia el enrolamiento TOTP (genera un secreto nuevo)
      description: >
        Auth: `preMfaToken`. Genera un secreto TOTP aleatorio, lo cifra (AES-256-GCM) y lo
        persiste como `PENDIENTE_CONFIRMACION`. El secreto en claro y la URI `otpauth://`
        (para el QR) solo se devuelven **en esta respuesta** — nunca se pueden volver a
        recuperar en claro despues. Si el MFA de la cuenta ya esta `ACTIVO`, responde 409
        `MFA_CHALLENGE_REQUIRED` (un `preMfaToken` no puede re-enrolar una cuenta que ya
        tiene MFA activo; eso requiere sesion completa + step-up, no implementado todavia).
      security: [{ bearerAuth: [] }]
      responses:
        '201':
          description: Secreto generado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaEnrollResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: El MFA ya esta activo para esta cuenta (codigo MFA_CHALLENGE_REQUIRED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /client/auth/mfa/enroll/confirm:
    post:
      tags: [auth-cliente]
      summary: Confirma el primer codigo TOTP y activa el MFA
      description: >
        Auth: `preMfaToken`. Valida el primer codigo TOTP contra el secreto pendiente. Si es
        correcto: activa el MFA, genera 10 codigos de recuperacion (devueltos en claro
        **unicamente en esta respuesta**, luego solo se guardan hasheados) y emite el token
        de sesion completo (`token_use: session`, `amr: [pwd, totp]`) — este es el paso que
        completa el login para quien enrola por primera vez. Rate-limited
        (`middleware/rateLimiters.js#mfaRateLimiter`).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaEnrollConfirmInput' }
      responses:
        '200':
          description: MFA activado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaSessionResponseCliente' }
        '400':
          description: >
            Codigo de confirmacion invalido o ya utilizado (codigo MFA_ENROLLMENT_INVALID),
            o el body no cumple el schema (codigo VALIDATION_ERROR)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: No hay un enrolamiento pendiente de confirmar (codigo MFA_ENROLLMENT_REQUIRED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429':
          description: Demasiados intentos (codigo MFA_RATE_LIMITED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /client/auth/mfa/verify:
    post:
      tags: [auth-cliente]
      summary: Completa el login verificando un codigo TOTP o de recuperacion
      description: >
        Auth: `preMfaToken`. Body: exactamente uno de `codigo` (TOTP, tolerancia ±1 paso de
        30s, un mismo codigo nunca se acepta dos veces) o `codigoRecuperacion` (un solo uso).
        Si es valido, emite el token de sesion completo (`amr: [pwd, totp]` o
        `[pwd, recovery]` segun el factor usado). Rate-limited
        (`middleware/rateLimiters.js#mfaRateLimiter`), independiente del bloqueo por cuenta
        tras varios intentos fallidos.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaVerifyInput' }
      responses:
        '200':
          description: Autenticacion exitosa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaSessionResponseCliente' }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: >
            Codigo TOTP/recuperacion invalido (codigo MFA_INVALID_CODE), el mismo codigo
            TOTP ya fue utilizado (codigo MFA_CODE_REUSED), o el codigo de recuperacion ya
            estaba consumido (codigo RECOVERY_CODE_ALREADY_USED) — o el token no es un
            preMfaToken valido (codigo TOKEN_INVALID/TOKEN_EXPIRED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '409':
          description: El MFA no esta activo para esta cuenta (codigo MFA_ENROLLMENT_REQUIRED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429':
          description: Demasiados intentos (codigo MFA_RATE_LIMITED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /admin/auth/login:
    post:
      tags: [auth-admin]
      summary: Verifica el password de un administrador e inicia el flujo de MFA
      description: >
        Unico endpoint publico bajo /admin/auth: crear administradores NO es una operacion
        de autenticacion (ver POST /admin/administradores). **Checkpoint 6B-2 — mismo
        cambio de contrato que `/client/auth/login`**: ya no devuelve un token de sesion
        directo, devuelve un `preMfaToken` (audiencia `prestamesta-admin-pre-mfa`) +
        `siguientePaso`. Aplica igual al SUPERADMIN recien sembrado por
        `npm run seed:superadmin`: su primer login tambien responde
        `MFA_ENROLLMENT_REQUIRED`, sin caso especial.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
            example:
              email: admin@prestamesta.com
              password: AdminSuperSeguro123
      responses:
        '200':
          description: Password correcto — continua con el flujo de MFA indicado en `siguientePaso`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginPreMfaResponse' }
        '401':
          description: >
            Credenciales invalidas o cuenta desactivada (codigo INVALID_CREDENTIALS).
            Mismo status/mensaje generico para correo inexistente, password incorrecto y
            cuenta con activo=false: no se revela cual de los tres paso.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /admin/auth/mfa/enroll:
    post:
      tags: [auth-admin]
      summary: Inicia el enrolamiento TOTP de un administrador
      description: >
        Auth: `preMfaToken` de admin. Mismo comportamiento que
        `POST /client/auth/mfa/enroll`, dominio administrador. Ademas relee `rol`/`activo`
        directo de BD (`middleware/cargarAdministradorActual.js`) antes de continuar: si el
        administrador fue desactivado entre el login y este paso, responde
        401 TOKEN_INVALID.
      security: [{ bearerAuth: [] }]
      responses:
        '201':
          description: Secreto generado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaEnrollResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: El MFA ya esta activo para esta cuenta (codigo MFA_CHALLENGE_REQUIRED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /admin/auth/mfa/enroll/confirm:
    post:
      tags: [auth-admin]
      summary: Confirma el primer codigo TOTP y activa el MFA de un administrador
      description: >
        Auth: `preMfaToken` de admin. Mismo comportamiento que
        `POST /client/auth/mfa/enroll/confirm`. El `rol` del token de sesion nuevo sale de
        `middleware/cargarAdministradorActual.js` (releido de BD), nunca del `preMfaToken`
        (que no incluye `rol` a proposito).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaEnrollConfirmInput' }
      responses:
        '200':
          description: MFA activado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaSessionResponseAdmin' }
        '400':
          description: Codigo invalido/ya utilizado (MFA_ENROLLMENT_INVALID) o body invalido (VALIDATION_ERROR)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: No hay un enrolamiento pendiente de confirmar (codigo MFA_ENROLLMENT_REQUIRED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429':
          description: Demasiados intentos (codigo MFA_RATE_LIMITED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /admin/auth/mfa/verify:
    post:
      tags: [auth-admin]
      summary: Completa el login de administrador verificando un codigo TOTP o de recuperacion
      description: >
        Auth: `preMfaToken` de admin. Mismo comportamiento que `POST /client/auth/mfa/verify`.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaVerifyInput' }
      responses:
        '200':
          description: Autenticacion exitosa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaSessionResponseAdmin' }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: >
            Codigo invalido (MFA_INVALID_CODE), codigo TOTP reutilizado (MFA_CODE_REUSED),
            o codigo de recuperacion ya consumido (RECOVERY_CODE_ALREADY_USED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '409':
          description: El MFA no esta activo para esta cuenta (codigo MFA_ENROLLMENT_REQUIRED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429':
          description: Demasiados intentos (codigo MFA_RATE_LIMITED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /admin/administradores:
    post:
      tags: [administradores]
      summary: Crea un nuevo administrador
      description: >
        Requiere un token de administrador (audiencia `prestamesta-admin`) cuyo rol,
        releido directamente de la base de datos (no del JWT), sea SUPERADMIN. El primer
        SUPERADMIN se crea unicamente con `npm run seed:superadmin` (script offline);
        este endpoint nunca esta disponible sin autenticar.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearAdministradorInput'
      responses:
        '201':
          description: Administrador creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje: { type: string, example: Administrador creado exitosamente }
                  adminId: { type: integer, example: 2 }
                  rol: { $ref: '#/components/schemas/Rol' }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: El correo ya esta registrado para un administrador (codigo EMAIL_ALREADY_EXISTS)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /prestamos/creditos:
    get:
      tags: [prestamos]
      summary: Lista el catalogo de creditos
      description: >
        Requiere estar autenticado, con token de cliente O de administrador (unico
        endpoint leido por ambos dominios). No es publico.
      responses:
        '200':
          description: Catalogo de creditos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Credito' }
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [prestamos]
      summary: Crea un tipo de credito en el catalogo
      description: Requiere rol SUPERADMIN o ANALISTA (releido de base de datos).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditoInput'
      responses:
        '201':
          description: Credito creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje: { type: string, example: Tipo de crédito creado con éxito }
                  creditoId: { type: integer, example: 1 }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /prestamos/solicitar:
    post:
      tags: [prestamos]
      summary: Solicita un prestamo (cliente autenticado)
      description: >
        monto_total_a_pagar y saldo_pendiente los calcula y valida el servidor siempre
        (interes simple anual prorrateado, ver x-formula en SolicitudPrestamoInput); el
        cliente nunca puede enviarlos ni influir en ellos, y el validador los rechaza si
        vienen en el body. fecha_solicitud la fija la base de datos al insertar.


        Rate limit propio por IP (`SOLICITUD_RATE_LIMIT_WINDOW_MS`/`SOLICITUD_RATE_LIMIT_MAX`,
        10 solicitudes/hora por defecto), independiente y menos agresivo que el de
        login/registro.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudPrestamoInput'
      responses:
        '201':
          description: Solicitud registrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje: { type: string, example: Solicitud de préstamo enviada con éxito }
                  prestamoId: { type: integer, example: 1 }
                  fechaSolicitud: { type: string, format: date-time, example: '2026-08-02T20:46:06.000Z' }
                  montoSolicitado: { type: number, example: 10000 }
                  montoTotalAPagar: { type: string, example: '12400.00' }
                  estado: { $ref: '#/components/schemas/EstadoPrestamo' }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Tipo de credito no encontrado (codigo CREDIT_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429':
          description: Se supero el limite de solicitudes por IP (SOLICITUD_RATE_LIMIT_*)

  /prestamos/{id}/estado:
    patch:
      tags: [prestamos]
      summary: Aprueba o rechaza una solicitud de prestamo
      description: >
        Requiere rol SUPERADMIN o ANALISTA (releido de base de datos). Transicion
        atomica solo desde PENDIENTE (SELECT ... FOR UPDATE + UPDATE condicional dentro
        de una transaccion). Un id inexistente responde 404 LOAN_NOT_FOUND; un prestamo
        que ya no esta PENDIENTE (doble aprobacion, condicion de carrera entre dos
        administradores, o estado ya terminal) responde 409 INVALID_TRANSITION — nunca
        200 en ninguno de los dos casos.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambiarEstadoInput'
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje: { type: string, example: 'El préstamo #1 ha sido aprobado exitosamente.' }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Prestamo no encontrado (codigo LOAN_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '409':
          description: El prestamo ya no esta en estado PENDIENTE (codigo INVALID_TRANSITION)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /client/prestamos:
    get:
      tags: [prestamos]
      summary: Lista los prestamos propios del cliente autenticado
      description: >
        `cliente_id` sale exclusivamente del JWT verificado (claim `sub`), nunca de query ni
        body; no existe forma de que un cliente consulte prestamos de otro. Orden fijo
        (no configurable): `fecha_solicitud DESC, id DESC`. Una pagina posterior a la
        ultima disponible responde 200 con `data: []`, nunca 404. Parametros de query
        repetidos (`?page=1&page=2`) se rechazan con 400 VALIDATION_ERROR.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Pagina de prestamos del cliente
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PrestamoClienteListItem' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /client/prestamos/{id}:
    get:
      tags: [prestamos]
      summary: Detalle de un prestamo propio (incluye credito y aval)
      description: >
        El filtro de propiedad (`WHERE id = ? AND cliente_id = ?`) vive dentro de la
        consulta SQL, no en una capa aparte. Un id que no existe y un id que existe pero
        pertenece a otro cliente responden EXACTAMENTE el mismo 404 LOAN_NOT_FOUND, sin
        distinguir el caso (mismo principio anti-enumeracion que el login). El aval es
        `null` si el prestamo no tiene uno registrado; si existe, sus campos opcionales
        ausentes (`direccion`) salen como `null`, nunca como cadena vacia.
      parameters:
        - $ref: '#/components/parameters/PrestamoId'
      responses:
        '200':
          description: Detalle del prestamo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrestamoClienteDetalle' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Prestamo inexistente o de otro cliente (codigo LOAN_NOT_FOUND, mismo caso)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /admin/prestamos:
    get:
      tags: [prestamos]
      summary: Lista prestamos de todos los clientes con filtros administrativos
      description: >
        Requiere rol SUPERADMIN o ANALISTA (releido de base de datos); COBRADOR no tiene
        acceso. Filtros opcionales combinables con AND: `estado`, `cliente_id`,
        `credito_id`, `fecha_desde`/`fecha_hasta` (sobre `fecha_solicitud`). `fecha_desde`
        es inclusiva desde las 00:00:00 del dia indicado; `fecha_hasta` incluye el dia
        completo, implementado como limite EXCLUSIVO del dia siguiente (nunca concatenando
        "23:59:59"). Ambos limites se interpretan en la zona horaria del proceso Node del
        servidor (no fijada explicitamente por esta app via `TZ`; hereda la del sistema o
        contenedor — el mismo comportamiento ya existente para `fecha_solicitud`). Enviar
        `fecha_desde` posterior a `fecha_hasta` responde 400 VALIDATION_ERROR. Orden fijo:
        `fecha_solicitud DESC, id DESC`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - in: query
          name: estado
          required: false
          schema: { $ref: '#/components/schemas/EstadoPrestamo' }
        - in: query
          name: cliente_id
          required: false
          schema: { type: integer, minimum: 1 }
          example: 7
        - in: query
          name: credito_id
          required: false
          schema: { type: integer, minimum: 1 }
          example: 1
        - in: query
          name: fecha_desde
          required: false
          schema: { type: string, format: date, example: '2026-01-01' }
          description: Inclusiva, 00:00:00 del dia indicado.
        - in: query
          name: fecha_hasta
          required: false
          schema: { type: string, format: date, example: '2026-01-31' }
          description: Incluye el dia completo (limite exclusivo del dia siguiente).
      responses:
        '200':
          description: Pagina de prestamos (vista administrativa)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PrestamoAdminListItem' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/prestamos/{id}:
    get:
      tags: [prestamos]
      summary: Detalle administrativo de un prestamo (incluye cliente, credito y aval)
      description: >
        Requiere rol SUPERADMIN o ANALISTA (releido de base de datos). Del cliente
        solicitante solo se exponen `id`, `nombre`, `email` y `telefono` (null si no existe
        en BD) — nunca password ni otros datos de perfil.
      parameters:
        - $ref: '#/components/parameters/PrestamoId'
      responses:
        '200':
          description: Detalle administrativo del prestamo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrestamoAdminDetalle' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Prestamo no encontrado (codigo LOAN_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /health/live:
    get:
      tags: [salud]
      summary: Liveness — el proceso Node/Express esta vivo
      description: No verifica MySQL ni Mongo. No requiere autenticacion.
      security: []
      servers:
        - url: /
      responses:
        '200':
          description: Proceso vivo
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  /health/ready:
    get:
      tags: [salud]
      summary: Readiness — conectividad real a MySQL y Mongo con timeout corto
      description: >
        No expone nombres de base de datos, hosts, versiones, credenciales ni stack
        traces. No requiere autenticacion.
      security: []
      servers:
        - url: /
      responses:
        '200':
          description: Listo para recibir trafico
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
        '503':
          description: No listo (alguna dependencia no responde)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: degraded }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Token JWT (HS256). Cliente y administrador usan audiencias distintas
        (`prestamesta-client` / `prestamesta-admin`): OpenAPI no puede expresar "audience
        distinta por operacion" con este securityScheme unico, pero la API lo aplica en
        cada ruta (ver la descripcion de cada operacion y el rol/tipoUsuario esperado).

  parameters:
    Page:
      in: query
      name: page
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
      description: Pagina 1-indexada. Un valor mayor a las paginas disponibles responde 200 con data vacia, nunca 404.
      example: 1
    Limit:
      in: query
      name: limit
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      example: 20
    PrestamoId:
      in: path
      name: id
      required: true
      schema: { type: integer, minimum: 1 }
      example: 1

  responses:
    ValidationError:
      description: Los datos enviados no son validos (codigo VALIDATION_ERROR)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: Token ausente, invalido o expirado (codigo TOKEN_INVALID o TOKEN_EXPIRED)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: Autenticado pero sin permiso para esta accion (codigo FORBIDDEN)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  schemas:
    ErrorEnvelope:
      type: object
      properties:
        mensaje: { type: string, example: Credenciales inválidas. }
        codigo:
          type: string
          enum:
            - INVALID_CREDENTIALS
            - TOKEN_INVALID
            - TOKEN_EXPIRED
            - FORBIDDEN
            - VALIDATION_ERROR
            - EMAIL_ALREADY_EXISTS
            - CREDIT_NOT_FOUND
            - LOAN_NOT_FOUND
            - INVALID_TRANSITION
            - NOT_FOUND
            - INTERNAL_ERROR
            - MFA_ENROLLMENT_REQUIRED
            - MFA_CHALLENGE_REQUIRED
            - MFA_ENROLLMENT_INVALID
            - MFA_INVALID_CODE
            - MFA_CODE_REUSED
            - RECOVERY_CODE_ALREADY_USED
            - MFA_RATE_LIMITED
          example: INVALID_CREDENTIALS
        requestId: { type: string, example: 3fa3a1c2-9c2b-4e9e-8b34-1a2b3c4d5e6f }
        detalles:
          type: array
          items:
            type: object
            properties:
              campo: { type: string, example: email }
              mensaje: { type: string, example: Invalid email address }

    Rol:
      type: string
      enum: [SUPERADMIN, ANALISTA, COBRADOR]

    EstadoPrestamo:
      type: string
      enum: [PENDIENTE, APROBADO, RECHAZADO]
      description: >
        x-pendiente-decision: ACTIVO, PAGADO/LIQUIDADO, EN_MORA y CANCELADO no estan
        implementados (no hay endpoint de pagos ni reglas de mora definidas en el codigo
        actual). No se incluyen en este enum hasta que exista esa decision de producto.

    ClienteRegistroInput:
      type: object
      required: [nombre, email, password]
      properties:
        nombre: { type: string, maxLength: 150, example: Juan Pérez }
        email: { type: string, format: email, maxLength: 190, example: juan@example.com }
        password:
          type: string
          minLength: 12
          maxLength: 72
          example: miPasswordSeguro123
          description: >
            Limite real es 72 BYTES (limite efectivo de bcrypt), no 72 caracteres: un
            password con caracteres multibyte UTF-8 puede exceder el limite con menos de
            72 caracteres. La API rechaza (nunca trunca) un password fuera de rango.
        telefono: { type: string, maxLength: 20, example: '8711234567' }
      additionalProperties: false

    CrearAdministradorInput:
      type: object
      required: [nombre, email, password, rol]
      properties:
        nombre: { type: string, maxLength: 150, example: Nuevo Analista }
        email: { type: string, format: email, maxLength: 190, example: analista@prestamesta.com }
        password:
          type: string
          minLength: 12
          maxLength: 72
          example: AdminSuperSeguro123
          description: Mismo limite de 72 bytes que ClienteRegistroInput.password.
        rol: { allOf: [{ $ref: '#/components/schemas/Rol' }], example: ANALISTA }
      additionalProperties: false

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
      additionalProperties: false

    SiguientePasoMfa:
      type: string
      enum: [MFA_ENROLLMENT_REQUIRED, MFA_CHALLENGE_REQUIRED]
      example: MFA_CHALLENGE_REQUIRED
      description: >
        Discriminador explicito que decide el siguiente paso del flujo de login. El cliente
        HTTP debe ramificar su UI a partir de este valor, nunca inferirlo de `mfaEstado`
        (que es informativo/depuracion). `MFA_ENROLLMENT_REQUIRED` cuando el MFA no esta
        `ACTIVO` (incluye `NO_ENROLADO` y `PENDIENTE_CONFIRMACION`); `MFA_CHALLENGE_REQUIRED`
        cuando ya esta `ACTIVO`.

    LoginPreMfaResponse:
      type: object
      description: >
        Checkpoint 6B-2: shape nuevo de `POST /client/auth/login` y `POST /admin/auth/login`
        tras un password correcto. Reemplaza por completo la respuesta anterior (que incluia
        `token` utilizable de inmediato) — cambio de contrato incompatible hacia atras, sin
        capa de compatibilidad temporal.
      properties:
        mensaje: { type: string, example: Verifica tu identidad para continuar. }
        preMfaToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
          description: >
            Token de vida corta (`PRE_MFA_EXPIRES_IN`, default 5 minutos), audiencia
            `*-pre-mfa` y `token_use: pre_mfa`. Solo sirve contra `mfa/enroll`,
            `mfa/enroll/confirm` y `mfa/verify` del mismo dominio (cliente o admin) — ninguna
            otra ruta lo acepta.
        siguientePaso: { $ref: '#/components/schemas/SiguientePasoMfa' }
        mfaEstado:
          type: string
          enum: [NO_ENROLADO, PENDIENTE_CONFIRMACION, ACTIVO]
          example: ACTIVO
          description: Estado crudo subyacente, informativo — la UI decide a partir de `siguientePaso`, no de este campo.

    MfaEnrollResponse:
      type: object
      description: >
        El secreto en claro y la URI otpauth:// se devuelven UNICAMENTE en esta respuesta.
        Ninguno de los dos se vuelve a exponer despues (se persisten cifrados, AES-256-GCM).
      properties:
        mensaje: { type: string, example: Escanea el codigo QR con tu aplicacion de autenticacion. }
        secreto:
          type: string
          example: JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP
          description: Secreto TOTP en base32, para mostrar como respaldo manual si el usuario no puede escanear el QR.
        otpauthUri:
          type: string
          example: 'otpauth://totp/Prestamesta:juan%40example.com?secret=JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP&issuer=Prestamesta&algorithm=SHA1&digits=6&period=30'
          description: URI estandar otpauth:// (RFC 6238), para renderizar como QR.

    MfaEnrollConfirmInput:
      type: object
      required: [codigo]
      properties:
        codigo:
          type: string
          pattern: '^\d{6}$'
          example: '123456'
          description: Codigo TOTP de 6 digitos, del secreto recien generado por mfa/enroll.
      additionalProperties: false

    MfaVerifyInput:
      type: object
      description: Exactamente uno de los dos campos, nunca ambos ni ninguno.
      properties:
        codigo:
          type: string
          pattern: '^\d{6}$'
          example: '123456'
          description: Codigo TOTP de 6 digitos del secreto ya activo.
        codigoRecuperacion:
          type: string
          example: 'A1B2-C3D4-E5F6-0708-090A'
          description: Codigo de recuperacion de un solo uso, entregado al confirmar el enrolamiento.
      additionalProperties: false

    MfaSessionResponseCliente:
      type: object
      description: >
        Respuesta de `client/auth/mfa/enroll/confirm` y `client/auth/mfa/verify` cuando el
        MFA se completa con exito: emite el token de SESION completo (`token_use: session`,
        `amr`, `auth_time` — ver la seccion 2/3.6 de docs/mfa-identidad-ine.md).
        `codigosRecuperacion` solo aparece en la respuesta de `mfa/enroll/confirm` (nunca en
        `mfa/verify`): son el lote nuevo generado al activar el MFA, en claro, una unica
        vez. `cliente` (perfil minimo, igual shape que devolvia el login previo a
        Checkpoint 6B-2) va en esta respuesta porque no existe un endpoint `/me`: es la
        primera vez que el cliente HTTP tiene un token de sesion utilizable y necesita
        datos para construir la sesion local. El `preMfaToken` usado para llegar hasta aqui
        NUNCA aparece en esta respuesta (ya cumplio su proposito).
      properties:
        mensaje: { type: string, example: Autenticacion exitosa. }
        token: { type: string, example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9... }
        cliente:
          type: object
          properties:
            id: { type: integer, example: 1 }
            nombre: { type: string, example: Juan Pérez }
            email: { type: string, format: email, example: juan@example.com }
        codigosRecuperacion:
          type: array
          items: { type: string, example: 'A1B2-C3D4-E5F6-0708-090A' }
          minItems: 10
          maxItems: 10

    MfaSessionResponseAdmin:
      type: object
      description: >
        Equivalente a MfaSessionResponseCliente para `admin/auth/mfa/enroll/confirm` y
        `admin/auth/mfa/verify`. `admin.rol` sale siempre de la relectura en BD de
        `middleware/cargarAdministradorActual.js` (nunca del token pre-MFA, que no incluye
        `rol` a proposito).
      properties:
        mensaje: { type: string, example: Autenticacion exitosa. }
        token: { type: string, example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9... }
        admin:
          type: object
          properties:
            id: { type: integer, example: 1 }
            nombre: { type: string, example: Admin Principal }
            email: { type: string, format: email, example: admin@prestamesta.com }
            rol: { $ref: '#/components/schemas/Rol' }
        codigosRecuperacion:
          type: array
          items: { type: string, example: 'A1B2-C3D4-E5F6-0708-090A' }
          minItems: 10
          maxItems: 10

    Credito:
      type: object
      properties:
        id: { type: integer, example: 1 }
        nombre: { type: string, example: Crédito Personal Express }
        monto_minimo: { type: string, example: '1000.00' }
        monto_maximo: { type: string, example: '20000.00' }
        tasa_interes_anual: { type: string, example: '24.00' }
        plazo_meses: { type: integer, example: 12 }
        creado_en: { type: string, format: date-time, example: '2026-08-02T02:43:54.000Z' }

    CreditoInput:
      type: object
      required: [nombre, monto_minimo, monto_maximo, tasa_interes_anual, plazo_meses]
      properties:
        nombre: { type: string, maxLength: 150, example: Crédito Personal Express }
        monto_minimo: { type: number, minimum: 0, exclusiveMinimum: true, example: 1000 }
        monto_maximo: { type: number, minimum: 0, exclusiveMinimum: true, example: 20000 }
        tasa_interes_anual: { type: number, minimum: 0, example: 24 }
        plazo_meses: { type: integer, minimum: 0, exclusiveMinimum: true, example: 12 }
      additionalProperties: false

    AvalInput:
      type: object
      required: [nombre, telefono]
      properties:
        nombre: { type: string, maxLength: 150, example: Roberto Gómez }
        telefono: { type: string, maxLength: 20, example: '8711234567' }
        direccion: { type: string, maxLength: 255, example: 'Av. Morelos #450, Centro' }
        ingreso_mensual: { type: number, minimum: 0, example: 15000 }
      additionalProperties: false

    SolicitudPrestamoInput:
      type: object
      required: [credito_id, monto_solicitado]
      description: >
        x-formula: monto_total_a_pagar = monto_solicitado + (monto_solicitado *
        tasa_interes_anual/100 * plazo_meses/12). Interes simple anual prorrateado
        linealmente por el plazo, sin capitalizacion, redondeado a 2 decimales
        (ROUND_HALF_UP). Regla de negocio existente en el codigo original, documentada
        aqui, no un modelo financiero universal.
      properties:
        credito_id: { type: integer, minimum: 0, exclusiveMinimum: true, example: 1 }
        monto_solicitado: { type: number, minimum: 0, exclusiveMinimum: true, example: 10000 }
        aval: { $ref: '#/components/schemas/AvalInput' }
      additionalProperties: false

    CambiarEstadoInput:
      type: object
      required: [estado]
      properties:
        estado: { type: string, enum: [APROBADO, RECHAZADO], example: APROBADO }
        motivo: { type: string, maxLength: 500, example: Cumple con el perfil de riesgo }
      additionalProperties: false

    Pagination:
      type: object
      properties:
        page: { type: integer, example: 1 }
        limit: { type: integer, example: 20 }
        total: { type: integer, example: 3, description: Total de filas que cumplen los filtros (todas las paginas). }
        totalPages: { type: integer, example: 1, description: '0 cuando total es 0.' }

    CreditoResumen:
      type: object
      description: Vista minima del credito (id + nombre), anidada en los listados de prestamos.
      properties:
        id: { type: integer, example: 1 }
        nombre: { type: string, example: Crédito Personal Express }

    ClienteResumen:
      type: object
      description: Vista minima del cliente, anidada en el listado administrativo de prestamos.
      properties:
        id: { type: integer, example: 7 }
        nombre: { type: string, example: Juan Pérez }
        email: { type: string, format: email, example: juan@example.com }

    AvalDetalle:
      type: object
      nullable: true
      description: >
        null si el prestamo no tiene aval registrado. Si existe, los campos opcionales
        ausentes salen como null (nunca '' ni 0): direccion es null si no se envio al
        solicitar, ingreso_mensual es un string DECIMAL como '0.00' unicamente si
        efectivamente se almaceno como cero.
      properties:
        id: { type: integer, example: 5 }
        nombre: { type: string, example: Roberto Gómez }
        telefono: { type: string, example: '8711234567' }
        direccion: { type: string, nullable: true, example: 'Av. Morelos #450, Centro' }
        ingreso_mensual: { type: string, nullable: true, example: '15000.00' }

    PrestamoClienteListItem:
      type: object
      description: >
        monto_solicitado/monto_total_a_pagar/saldo_pendiente son strings (columnas
        DECIMAL leidas directo de MySQL, mysql2 sin `decimalNumbers`) -- a diferencia de
        POST /prestamos/solicitar, donde montoSolicitado en la respuesta es el number que
        envio el cliente en el body, nunca releido de BD. Es una asimetria real entre
        ambos endpoints, no normalizada aqui a proposito.
      properties:
        id: { type: integer, example: 1 }
        credito: { $ref: '#/components/schemas/CreditoResumen' }
        monto_solicitado: { type: string, example: '10000.00' }
        monto_total_a_pagar: { type: string, example: '12400.00' }
        saldo_pendiente: { type: string, example: '12400.00' }
        estado: { $ref: '#/components/schemas/EstadoPrestamo' }
        fecha_solicitud: { type: string, format: date-time, example: '2026-08-02T20:46:06.000Z' }
        fecha_decision: { type: string, format: date-time, nullable: true, example: null }

    PrestamoClienteDetalle:
      allOf:
        - $ref: '#/components/schemas/PrestamoClienteListItem'
        - type: object
          properties:
            aval: { $ref: '#/components/schemas/AvalDetalle' }

    PrestamoAdminListItem:
      type: object
      properties:
        id: { type: integer, example: 1 }
        cliente: { $ref: '#/components/schemas/ClienteResumen' }
        credito: { $ref: '#/components/schemas/CreditoResumen' }
        monto_solicitado: { type: string, example: '10000.00' }
        monto_total_a_pagar: { type: string, example: '12400.00' }
        saldo_pendiente: { type: string, example: '12400.00' }
        estado: { $ref: '#/components/schemas/EstadoPrestamo' }
        fecha_solicitud: { type: string, format: date-time, example: '2026-08-02T20:46:06.000Z' }
        fecha_decision: { type: string, format: date-time, nullable: true, example: null }

    ClienteDetalleAdmin:
      type: object
      description: Nunca incluye password ni otros datos de perfil fuera de estos cuatro campos.
      properties:
        id: { type: integer, example: 7 }
        nombre: { type: string, example: Juan Pérez }
        email: { type: string, format: email, example: juan@example.com }
        telefono: { type: string, nullable: true, example: '8711234567' }

    PrestamoAdminDetalle:
      type: object
      properties:
        id: { type: integer, example: 1 }
        cliente: { $ref: '#/components/schemas/ClienteDetalleAdmin' }
        credito: { $ref: '#/components/schemas/Credito' }
        monto_solicitado: { type: string, example: '10000.00' }
        monto_total_a_pagar: { type: string, example: '12400.00' }
        saldo_pendiente: { type: string, example: '12400.00' }
        estado: { $ref: '#/components/schemas/EstadoPrestamo' }
        fecha_solicitud: { type: string, format: date-time, example: '2026-08-02T20:46:06.000Z' }
        fecha_decision: { type: string, format: date-time, nullable: true, example: null }
        aval: { $ref: '#/components/schemas/AvalDetalle' }
